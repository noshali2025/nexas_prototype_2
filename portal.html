<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexaPoint — Internal Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
.portal-nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--ink);
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; padding: 0 32px; height: 58px; gap: 0;
}
.p-nav-item {
  display: flex; align-items: center; gap: 7px;
  padding: 0 18px; height: 100%;
  background: none; border: none; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s, border-color .15s;
}
.p-nav-item.active { color: #f2eee3; border-bottom-color: var(--accent); }
.p-nav-item:not(.active) { color: rgba(255,255,255,.45); }
.p-nav-item:not(.active):hover { color: rgba(255,255,255,.75); }

.stat-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px;
}

.proposal-row { cursor: pointer; border-bottom: 1px solid var(--line); transition: background .12s; }
.proposal-row:last-child { border-bottom: none; }
.proposal-row:hover { background: var(--bg-alt) !important; }

.tab-btn {
  padding: 12px 24px; background: none; border: none; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s, border-color .15s;
}
.tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); }
.tab-btn:not(.active) { color: var(--muted); }
.tab-btn.disabled { color: var(--line-2); cursor: not-allowed; }

.team-member-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  transition: all .15s; cursor: pointer;
}
.team-member-row.assigned { border-color: var(--ink); background: var(--bg-alt); }

.progress-bar-bg { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }

@keyframes portalIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.portal-enter { animation: portalIn .35s cubic-bezier(.2,.8,.2,1); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="portal.jsx"></script>
</body>
</html>
