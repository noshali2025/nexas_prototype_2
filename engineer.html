<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexaPoint — Engineering Provisioning System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
/* Engineer portal overrides */
.eng-nav {
  position: sticky; top: 0; z-index: 50;
  background: #0a1f16;
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; padding: 0 32px; height: 58px; gap: 0;
}
.eng-nav-item {
  display: flex; align-items: center; gap: 7px;
  padding: 0 18px; height: 100%;
  background: none; border: none; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s, border-color .15s; color: rgba(255,255,255,.45);
}
.eng-nav-item:hover { color: rgba(255,255,255,.75); }

.job-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 24px;
  cursor: pointer; transition: all .2s ease;
}
.job-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--line-2); }

.cat-btn {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border: none; background: none; cursor: pointer;
  font-family: var(--sans); font-size: 13px; text-align: left;
  border-radius: var(--radius-sm); transition: background .12s;
  color: var(--ink-2);
}
.cat-btn:hover { background: var(--bg-alt); }
.cat-btn.active { background: var(--ink); color: var(--bg); }

.task-row {
  padding: 14px 0; border-bottom: 1px solid var(--line);
  transition: background .1s;
}
.task-row:last-child { border-bottom: none; }

.task-check {
  width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;
  border: 1.5px solid var(--line-2); display: grid; placeItems: center;
  cursor: pointer; transition: all .15s; background: var(--surface);
}
.task-check.done { background: #1b6b4a; border-color: #1b6b4a; color: #fff; }
.task-check.blocked { background: #a3331f; border-color: #a3331f; color: #fff; }
.task-check.in-progress { border-color: #16478f; background: rgba(22,71,143,.1); }

.progress-track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }

.sign-off-panel {
  background: color-mix(in srgb, #1b6b4a 6%, var(--surface));
  border: 1px solid color-mix(in srgb, #1b6b4a 30%, var(--line));
  border-radius: var(--radius-lg); padding: 28px 32px;
}

@keyframes engIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
.eng-enter { animation: engIn .32s cubic-bezier(.2,.8,.2,1); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="engineer.jsx"></script>
</body>
</html>
