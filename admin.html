<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexaPoint — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
/* ── Admin Shell ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }

.admin-shell {
  display: flex; min-height: 100vh;
}

/* Sidebar */
.admin-sidebar {
  width: 224px; flex-shrink: 0;
  background: #0b1e3a;
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100; overflow-y: auto;
}
.admin-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.admin-logo-mark {
  width: 30px; height: 30px; background: var(--accent);
  border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 14px; color: #fff; font-weight: 600;
}
.admin-nav-section {
  padding: 12px 10px 4px;
  font-size: 9px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.28);
  padding-left: 14px;
}
.admin-nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 14px; border: none; border-radius: 7px;
  margin: 1px 6px; width: calc(100% - 12px);
  background: none; cursor: pointer; text-align: left;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.5); transition: all .15s;
}
.admin-nav-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.9); }
.admin-nav-item.active { background: rgba(184,147,90,.18); color: #f2e8d5; }
.admin-nav-item.active svg { opacity: 1; }
.admin-nav-item svg { opacity: .55; flex-shrink: 0; }
.admin-nav-item.active svg { opacity: 1; }

.admin-user-block {
  margin-top: auto; padding: 14px 14px 20px;
  border-top: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 10px;
}
.admin-user-avatar {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .02em;
}

/* Main content */
.admin-main {
  margin-left: 224px; flex: 1; min-height: 100vh;
  background: var(--bg, #f7f5f0);
}
.admin-topbar {
  height: 56px; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 32px;
  position: sticky; top: 0; z-index: 50; gap: 12px;
}
.admin-content {
  padding: 32px;
  max-width: 1400px;
}

/* Cards & tables */
.admin-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 24px;
}
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th {
  padding: 9px 14px; text-align: left; font-weight: 600;
  font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); background: var(--bg-alt);
  border-bottom: 1px solid var(--line-2);
  white-space: nowrap;
}
.admin-table td { padding: 11px 14px; vertical-align: middle; border-bottom: 1px solid var(--line); }
.admin-table tbody tr { transition: background .1s; }
.admin-table tbody tr:hover { background: var(--bg-alt); }
.admin-table tbody tr:last-child td { border-bottom: none; }

/* Stat card */
.stat-card-admin {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; border-top: 3px solid;
}

/* Avatar */
.staff-avatar {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; letter-spacing: .03em;
}

/* Badge */
.badge {
  display: inline-flex; align-items: center;
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 20px;
}

/* Search bar */
.admin-search {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  padding: 7px 12px; background: var(--surface); width: 260px;
}
.admin-search input {
  border: none; background: none; outline: none; font-size: 13px;
  color: var(--ink); flex: 1; font-family: var(--sans);
}

/* Modal */
.admin-modal-bg {
  position: fixed; inset: 0; background: rgba(11,30,58,.65);
  z-index: 1000; display: grid; place-items: start center;
  backdrop-filter: blur(5px); overflow-y: auto; padding: 20px;
}
.admin-modal {
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--radius-lg); width: min(560px, 94vw);
  box-shadow: var(--shadow-lg); animation: fadeUp .22s ease;
  margin: auto;
}
.admin-modal-lg {
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--radius-lg); width: min(800px, 94vw);
  box-shadow: var(--shadow-lg); animation: fadeUp .22s ease;
  margin: auto;
}
.admin-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; border-bottom: 1px solid var(--line);
}
.admin-modal-body { padding: 24px; }
.admin-modal-foot {
  padding: 16px 24px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-end;
}

/* Grid form */
.form-grid { display: flex; flex-wrap: wrap; gap: 14px; }
.form-grid .field { display: flex; flex-direction: column; gap: 5px; }
.form-grid .field label {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em;
}
.form-grid .field input,
.form-grid .field select,
.form-grid .field textarea {
  padding: 9px 11px; border: 1px solid var(--line-2);
  border-radius: var(--radius-sm); background: var(--surface);
  color: var(--ink); font-size: 13px; font-family: var(--sans); width: 100%;
}
.form-grid .field.half { flex: 0 0 calc(50% - 7px); }
.form-grid .field.full { flex: 0 0 100%; }
.form-grid .field.third { flex: 0 0 calc(33.33% - 10px); }

/* Revenue chart bars */
.rev-bar-wrap { display: flex; align-items: flex-end; gap: 10px; height: 180px; }
.rev-bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
.rev-bar-stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; flex: 1; }

/* Chip filters */
.chip-filter {
  padding: 6px 14px; border: 1px solid var(--line-2); border-radius: 20px;
  background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--muted); transition: all .15s; white-space: nowrap;
}
.chip-filter.active {
  background: var(--ink); color: #fff; border-color: var(--ink);
}

/* Payslip */
.payslip-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.payslip-row:last-child { border-bottom: none; }
.payslip-total-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; font-weight: 700; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="admin.jsx"></script>
</body>
</html>
